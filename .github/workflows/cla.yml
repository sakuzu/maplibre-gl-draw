# Records the contributor's acceptance of CLA.md on each pull request.
# The gates run in ci.yml.
name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: cla
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token with contents:write on sakuzu/cla-signatures.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          remote-organization-name: sakuzu
          remote-repository-name: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/sakuzu/maplibre-gl-draw/blob/main/CLA.md
          branch: main
          # The copyright holder is not asked to sign the CLA
          allowlist: asakaida,dependabot[bot],github-actions[bot]
