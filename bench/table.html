<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rows Held as Columns Benchmark</title>
    <style>
      html, body { margin: 0; padding: 0; background: #fff; }
      /* Only the parts of maplibre-gl.css needed to lay out the map (no CDN dependency). */
      .maplibregl-map { position: relative; overflow: hidden; }
      .maplibregl-canvas { position: absolute; left: 0; top: 0; }
      /* Fix the map at 1280x800 so the measurement conditions stay constant. */
      #map { width: 1280px; height: 800px; }
      #side {
        position: absolute; top: 0; left: 1280px; width: 460px; padding: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px; line-height: 1.5; color: #212529;
      }
      #params label { display: inline-block; margin: 2px 8px 2px 0; }
      #params input { width: 80px; }
      button { margin: 6px 6px 6px 0; padding: 4px 12px; font-size: 12px; }
      #status { white-space: pre-wrap; margin: 6px 0; }
      table { border-collapse: collapse; margin: 6px 0; }
      th, td { border: 1px solid #ced4da; padding: 2px 6px; text-align: right; }
      th:first-child, td:first-child { text-align: left; }
      .stopped { color: #c92a2a; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="side">
      <form id="params" method="get">
        <label>mode
          <select name="mode">
            <option value="table">table (rows of columns)</option>
            <option value="store">store (features)</option>
          </select>
        </label>
        <label>drawing
          <select name="drawing">
            <option value="one-draw">one draw per chunk</option>
            <option value="by-kind">by kind</option>
          </select>
        </label>
        <label>terrain
          <select name="terrain">
            <option value="0">off (flat)</option>
            <option value="1">on (Mapterhorn, exaggeration 1.5)</option>
          </select>
        </label>
        <label>n <input name="n" type="number" min="1"></label>
        <label>kind
          <select name="kind">
            <option value="point">point</option>
            <option value="line">line of 10 vertices</option>
            <option value="polygon5">polygon of 5 vertices</option>
            <option value="polygon50">polygon of 50 vertices</option>
            <option value="mixed">mixed, interleaved</option>
          </select>
        </label>
        <label>styles <input name="styles" type="number" min="1"></label>
        <label>alpha
          <select name="alpha">
            <option value="1">translucent</option>
            <option value="0">opaque</option>
          </select>
        </label>
        <label>cuts
          <select name="cuts">
            <option value="0">0</option>
            <option value="100">100</option>
            <option value="1000">1000</option>
            <option value="3000">3000</option>
          </select>
        </label>
        <label>heap limit
          <select name="limit">
            <option value="1024">1 GB (PC)</option>
            <option value="500">500 MB (iPad)</option>
            <option value="400">400 MB (iPhone)</option>
          </select>
        </label>
        <label>data (file of bench/data/) <input name="data" type="text" placeholder="made in the page"></label>
        <label>order
          <select name="shuffle">
            <option value="0">as in the file</option>
            <option value="1">at random</option>
          </select>
        </label>
        <label>edit
          <select name="op">
            <option value="color1">a color changed</option>
            <option value="colorSlide">a color slid</option>
            <option value="ruleSlide">the steps of the rule slid</option>
            <option value="attr">an attribute written</option>
            <option value="point">a point moved</option>
            <option value="longLine">a vertex of the longest line moved</option>
            <option value="corner">a corner of a building moved</option>
            <option value="finish">a building finished in the middle of the order</option>
            <option value="hover">the pointer moved over the map (one move per frame)</option>
            <option value="click">a click that selects a building, to its handles</option>
            <option value="vertexAdd">a vertex added by a drag of a midpoint</option>
            <option value="vertexRemove">a vertex taken off and put back</option>
            <option value="delete">a feature selected and deleted</option>
            <option value="moveSelected">rows selected (held of them) and dragged (one frame per rep)</option>
            <option value="panSelected">rows selected (held of them) while the map pans</option>
            <option value="group">members rows grouped, then ungrouped</option>
            <option value="toLayer">members rows put in another layer, then back</option>
            <option value="order1">a row brought to the front, then sent to the back</option>
            <option value="orderMany">members rows brought to the front, then sent to the back</option>
            <option value="undoRedo">an edit of members rows undone and redone</option>
            <option value="boxHeld">a box drawn with Shift, grown and shrunk (one move per rep)</option>
          </select>
        </label>
        <label>held <input name="held" type="number" min="1"></label>
        <label>large area under the rows (vertices) <input name="bigArea" type="number" min="0"></label>
        <label>reps <input name="reps" type="number" min="1"></label>
        <label>rule (key:breaks) <input name="rule" type="text"></label>
        <label>changes of others
          <select name="remote">
            <option value="color">colors</option>
            <option value="attr">attributes</option>
            <option value="position">positions of points</option>
            <option value="corner">corners of buildings</option>
            <option value="reorder">rows put in another place of the order</option>
            <option value="group">groups of features put in another place</option>
            <option value="vertex">a vertex added to a building past its place</option>
            <option value="import">an import (importN rows by txn, until sent)</option>
          </select>
        </label>
        <label>rate (rows/s)
          <select name="rate">
            <option value="1">1</option>
            <option value="10">10</option>
            <option value="100">100</option>
            <option value="1000">1000</option>
          </select>
        </label>
        <label>seconds <input name="seconds" type="number" min="1"></label>
        <label>importN <input name="importN" type="number" min="1"></label>
        <label>txn <input name="txn" type="number" min="1"></label>
        <label>groups <input name="groups" type="number" min="1"></label>
        <label>members <input name="members" type="number" min="1"></label>
        <label>versions while moving (ms) <input name="moving" type="number" min="0"></label>
        <label>workers of the opening <input name="workers" type="number" min="0" placeholder="0: by the cores"></label>
        <label>worker
          <select name="worker">
            <option value="1">merges and builds in a Worker</option>
            <option value="0">on the main thread</option>
          </select>
        </label>
        <button type="submit">Apply (reload)</button>
      </form>
      <button id="confirm" type="button" hidden>Confirm more than 100,000 features</button>
      <button id="start" type="button">Start</button>
      <button id="edit" type="button">Edit</button>
      <button id="stream" type="button">Stream</button>
      <div id="status">Starting...</div>
      <div id="result"></div>
    </div>
    <script type="module" src="./table-main.ts"></script>
  </body>
</html>
