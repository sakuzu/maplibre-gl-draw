<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening in Steps</title>
    <style>
      html, body { margin: 0; padding: 0; background: #fff; }
      /* Only the parts of maplibre-gl.css needed to lay out the map (no CDN dependency). */
      .maplibregl-map { position: relative; overflow: hidden; }
      .maplibregl-canvas { position: absolute; left: 0; top: 0; }
      /* Fix the map at 1280x800 so the measurement conditions stay constant. */
      #map { width: 1280px; height: 800px; }
      #side {
        position: absolute; top: 0; left: 1280px; width: 520px; padding: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px; line-height: 1.5; color: #212529;
      }
      #params label { display: inline-block; margin: 2px 8px 2px 0; }
      #params input { width: 90px; }
      #params input[name="data"], #params input[name="attach"] { width: 260px; }
      button { margin: 6px 6px 6px 0; padding: 4px 12px; font-size: 12px; }
      #status { white-space: pre-wrap; margin: 6px 0; }
      #presets a { margin-right: 8px; }
      table { border-collapse: collapse; margin: 6px 0; }
      th, td { border: 1px solid #ced4da; padding: 2px 6px; text-align: right; }
      th:first-child, td:first-child { text-align: left; }
      .failed { color: #c92a2a; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="side">
      <form id="params" method="get">
        <label>data (set of bench/data/stage0/) <input name="data" type="text"></label>
        <label>view
          <select name="view">
            <option value="city">city (zoom 14 over the most rows)</option>
            <option value="all">all (every row in the view)</option>
          </select>
        </label>
        <label>Mbps (0: not limited) <input name="mbps" type="number" min="0"></label>
        <label>round trip (ms) <input name="rtt" type="number" min="0"></label>
        <label>requests at once <input name="inflight" type="number" min="1"></label>
        <label>Workers (0: by the cores) <input name="workers" type="number" min="0"></label>
        <label>attach (set of bench/data/stage0/) <input name="attach" type="text"></label>
        <button type="submit">Apply (reload)</button>
      </form>
      <div id="presets"></div>
      <button id="open" type="button">Open</button>
      <button id="attach" type="button" disabled>Attach</button>
      <div id="status">Starting...</div>
      <div id="result"></div>
    </div>
    <script type="module" src="./open-main.ts"></script>
  </body>
</html>
