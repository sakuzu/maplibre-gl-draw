<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editing Benchmark</title>
    <style>
      html, body { margin: 0; padding: 0; background: #fff; }
      /* Only the parts of maplibre-gl.css needed to lay out the map (no CDN dependency). */
      .maplibregl-map { position: relative; overflow: hidden; }
      .maplibregl-canvas { position: absolute; left: 0; top: 0; }
      /* Fix the map at 1280x800 so the measurement conditions stay constant. */
      #map { width: 1280px; height: 800px; }
      #panel {
        position: absolute; top: 0; left: 1280px; width: 520px; padding: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px; line-height: 1.6; color: #212529;
      }
      #panel h1 { font-size: 14px; margin: 0 0 4px; }
      #counts a { margin-right: 6px; }
      #counts a.current { font-weight: bold; text-decoration: none; color: inherit; }
      #status, #results { white-space: pre-wrap; margin: 6px 0; }
      #scenes div { margin: 2px 0; }
      #scenes span { color: #495057; }
      button { font: inherit; padding: 1px 8px; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <h1>Editing Benchmark</h1>
      <div>Features: <span id="counts"></span></div>
      <div id="status">Starting...</div>
      <div id="scenes"></div>
      <div id="results"></div>
    </div>
    <script type="module" src="./edit-main.ts"></script>
  </body>
</html>
